services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: node -e "
      const http=require('http'),fs=require('fs'),path=require('path');
      http.createServer((req,res)=>{
        let f='index.html',ct='text/html';
        if(req.url!=='/'&&req.url!=='/index.html'){
          f='.'+decodeURIComponent(req.url.split('?')[0]);
          const ext=path.extname(f);
          ct={'.js':'text/javascript','.css':'text/css','.json':'application/json','.png':'image/png','.jpg':'image/jpeg','.svg':'image/svg+xml'}[ext]||'application/octet-stream';
        }
        fs.readFile(f,(e,d)=>{
          if(e){res.writeHead(404);res.end('Not found');return;}
          res.writeHead(200,{'Content-Type':ct+'; charset=utf-8','Cache-Control':'no-cache'});
          res.end(d);
        });
      }).listen(3000,'0.0.0.0',()=>console.log('Server on :3000'));
      "
    ports:
      - "3000:3000"
    restart: unless-stopped
