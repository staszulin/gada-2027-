<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>GADA GROUP</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GADA GROUP"/>
<meta name="theme-color" content="#080c14"/>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;GADA GROUP&quot;,&quot;short_name&quot;:&quot;GADA&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23080c14&quot;,&quot;theme_color&quot;:&quot;%23f59e0b&quot;}"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap');
:root{
  --bg:#080c14;--bg2:#0d1220;--card:#111827;--card2:#1a2235;
  --border:#1e2d45;--border2:#243250;
  --gold:#f59e0b;--gold2:#fbbf24;--gold-dim:rgba(245,158,11,0.1);--gold-glow:rgba(245,158,11,0.25);
  --green:#10b981;--green-dim:rgba(16,185,129,0.12);
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,0.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.1);
  --orange:#f97316;--orange-dim:rgba(249,115,22,0.12);
  --purple:#8b5cf6;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:15px;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* SCREENS */
.screen{display:none;width:100%;height:100vh;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;}

/* LOGIN */
#loginScreen{
  align-items:center;justify-content:center;padding:28px;gap:0;
  background:radial-gradient(ellipse at 50% -10%,rgba(245,158,11,0.07) 0%,transparent 65%),var(--bg);
}
.login-logo-wrap{position:relative;margin-bottom:14px;}
.login-logo{width:108px;height:108px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 22px rgba(245,158,11,0.45));}
.ring{position:absolute;border-radius:50%;border-style:solid;border-color:transparent;}
.ring1{inset:-9px;border-width:1.5px;border-top-color:rgba(245,158,11,0.5);border-right-color:rgba(245,158,11,0.2);animation:spin 10s linear infinite;}
.ring2{inset:-18px;border-width:1px;border-bottom-color:rgba(245,158,11,0.25);animation:spin 18s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg);}}
.login-title{font-size:28px;font-weight:900;letter-spacing:3px;color:var(--gold);margin-top:4px;}
.login-sub{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:3px;margin-bottom:32px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%;max-width:390px;}
.role-card{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--r);
  padding:22px 12px;text-align:center;cursor:pointer;transition:all 0.22s;position:relative;overflow:hidden;
}
.role-card::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.22s;background:var(--rc-bg,var(--gold-dim));}
.role-card:hover::after,.role-card:active::after{opacity:1;}
.role-card:active{transform:scale(0.96);}
.rc-icon{font-size:30px;margin-bottom:8px;position:relative;z-index:1;}
.rc-name{font-size:16px;font-weight:800;position:relative;z-index:1;}
.rc-desc{font-size:10px;color:var(--text3);margin-top:2px;position:relative;z-index:1;}
.rc-agent{--rc-bg:rgba(245,158,11,0.1);}
.rc-wh{--rc-bg:rgba(59,130,246,0.1);}
.rc-driver{--rc-bg:rgba(16,185,129,0.1);}
.rc-mgr{--rc-bg:rgba(249,115,22,0.1);}

/* LOGIN FORM */
#loginScreen { gap:0; }
#loginScreen .finp { font-size:16px; }
#loginScreen .btn-gold { margin-top:4px; font-size:16px; padding:15px; }

/* NAME SCREEN */
#nameScreen{align-items:center;justify-content:center;padding:24px;gap:10px;background:var(--bg);}
.name-logo{width:68px;height:68px;object-fit:contain;border-radius:50%;}
.name-title{font-size:19px;font-weight:900;color:var(--gold);}
.name-sub{font-size:11px;color:var(--text3);margin-bottom:6px;}
.name-list{width:100%;max-width:350px;display:flex;flex-direction:column;gap:8px;}
.name-btn{
  background:var(--card);border:1px solid var(--border2);border-radius:12px;
  padding:18px 18px;font-size:17px;font-weight:700;font-family:'Heebo',sans-serif;
  color:var(--text);cursor:pointer;text-align:right;transition:all 0.2s;
  display:flex;align-items:center;gap:12px;
}
.name-btn:hover,.name-btn:active{border-color:var(--gold);background:var(--gold-dim);color:var(--gold);}
.nb-av{
  width:34px;height:34px;border-radius:50%;background:var(--gold-dim);
  border:1px solid var(--gold-glow);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:var(--gold);flex-shrink:0;
}
.back-lnk{font-size:12px;color:var(--text3);cursor:pointer;margin-top:6px;}
.back-lnk:hover{color:var(--gold);}

/* PIN SCREEN */
#pinScreen{align-items:center;justify-content:center;padding:24px;gap:12px;background:var(--bg);}
.pin-logo{width:68px;height:68px;object-fit:contain;border-radius:50%;}
.pin-title{font-size:19px;font-weight:900;color:var(--gold);}
.pin-sub{font-size:11px;color:var(--text3);}
.pin-dots{display:flex;gap:14px;margin:2px 0;}
.pdot{width:13px;height:13px;border-radius:50%;border:2px solid var(--border2);transition:all 0.15s;}
.pdot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold-glow);}
.pin-err{height:16px;font-size:11px;font-weight:700;color:var(--red);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:252px;}
.pkey{
  background:var(--card);border:1px solid var(--border2);border-radius:13px;
  padding:17px 8px;font-size:21px;font-weight:700;font-family:'Heebo',sans-serif;
  color:var(--text);cursor:pointer;text-align:center;transition:all 0.14s;
}
.pkey:active{background:var(--gold-dim);border-color:var(--gold);transform:scale(0.91);}

/* APP FRAME */
#appFrame{background:var(--bg);}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  height:54px;padding:0 15px;display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.tb-logo{width:33px;height:33px;border-radius:50%;object-fit:contain;flex-shrink:0;}
.tb-name{font-size:14px;font-weight:900;color:var(--gold);letter-spacing:1px;flex:1;}
.tb-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;}
.tb-agent{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-glow);}
.tb-wh{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(59,130,246,0.25);}
.tb-driver{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,0.25);}
.tb-mgr{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(249,115,22,0.25);}
.tb-live{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--green);}
.tb-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.3;transform:scale(0.7);}}
.tb-exit{background:none;border:1px solid var(--border2);color:var(--text3);border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer;font-family:'Heebo',sans-serif;}
.tb-exit:hover{border-color:var(--red);color:var(--red);}

/* ALERT BANNER - only for manager/warehouse */
.alert-banner{
  display:none;background:linear-gradient(90deg,rgba(239,68,68,0.14),transparent);
  border-bottom:1px solid rgba(239,68,68,0.18);
  padding:8px 15px;align-items:center;gap:8px;
  font-size:12px;color:var(--red);font-weight:600;cursor:pointer;flex-shrink:0;
}
.alert-banner.show{display:flex;}
.ab-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite;flex-shrink:0;}

.scroll-area{flex:1;overflow-y:auto;padding:15px;}

/* TABS */
.tabs{display:flex;gap:3px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:14px;border:1px solid var(--border);}
.tab-btn{flex:1;padding:9px 5px;border-radius:8px;font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;border:none;background:none;font-family:'Heebo',sans-serif;transition:all 0.18s;text-align:center;}
.tab-btn.on{background:var(--gold);color:#000;}
.tab-pane{display:none;}
.tab-pane.on{display:block;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px;}
.sbox{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 7px;text-align:center;}
.sbox-num{font-size:28px;font-weight:900;line-height:1;}
.sbox-lbl{font-size:9px;color:var(--text3);margin-top:2px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:12px;}
.card-title{display:flex;align-items:center;gap:7px;margin-bottom:12px;}
.card-title h3{font-size:14px;font-weight:800;}

/* FORM */
.fg{margin-bottom:11px;}
.fg:last-child{margin-bottom:0;}
.flbl{display:block;font-size:10px;font-weight:700;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;}
.finp{
  width:100%;background:var(--bg2);border:1.5px solid var(--border2);
  border-radius:var(--rs);padding:12px 13px;font-size:16px;color:var(--text);
  font-family:'Heebo',sans-serif;outline:none;transition:border-color 0.18s;direction:rtl;
}
.finp:focus{border-color:var(--gold);}
.finp option{background:var(--card);}
textarea.finp{resize:vertical;min-height:68px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 20px;border-radius:10px;font-size:15px;font-weight:800;
  font-family:'Heebo',sans-serif;cursor:pointer;border:none;
  transition:all 0.18s;width:100%;letter-spacing:0.2px;
}
.btn:active{transform:scale(0.97);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;box-shadow:0 3px 12px rgba(245,158,11,0.28);}
.btn-green{background:linear-gradient(135deg,#059669,var(--green));color:#fff;box-shadow:0 3px 12px rgba(16,185,129,0.25);}
.btn-blue{background:linear-gradient(135deg,#2563eb,var(--blue));color:#fff;}
.btn-red{background:linear-gradient(135deg,#dc2626,var(--red));color:#fff;}
.btn-ghost{background:transparent;border:1.5px solid var(--border2);color:var(--text2);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-sm{padding:7px 13px;font-size:11px;width:auto;border-radius:7px;}

/* ORDER CARD */
.ocard{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:9px;overflow:hidden;
  border-right:3px solid transparent;
}
.ocard.s-new{border-right-color:var(--gold);}
.ocard.s-picking{border-right-color:var(--blue);}
.ocard.s-done{border-right-color:var(--green);}
.ocard.s-loaded{border-right-color:var(--orange);}
.ocard.stale{box-shadow:0 0 0 1px rgba(239,68,68,0.35);}
.ocard-head{padding:12px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:7px;}
.oh-l{flex:1;min-width:0;}
.oh-chain{font-size:16px;font-weight:800;color:var(--gold);}
.oh-city{font-size:14px;font-weight:600;margin-top:1px;}
.oh-addr{font-size:12px;color:var(--text3);margin-top:1px;}
.oh-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.spill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.3px;}
.sp-new{background:var(--gold-dim);color:var(--gold);}
.sp-picking{background:var(--blue-dim);color:var(--blue);}
.sp-done{background:var(--green-dim);color:var(--green);}
.sp-loaded{background:var(--orange-dim);color:var(--orange);}
.zpill{font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;background:rgba(139,92,246,0.1);color:var(--purple);border:1px solid rgba(139,92,246,0.18);}
.oh-pal{font-size:11px;font-weight:700;color:var(--text2);}
.oh-agent{font-size:11px;color:var(--text3);}
.ocard-body{display:none;border-top:1px solid var(--border);padding:12px 13px;}
.ocard-body.open{display:block;}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-bottom:9px;}
.dg-k{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;margin-bottom:1px;}
.dg-v{font-size:12px;font-weight:600;}
.nchip{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-size:13px;color:var(--text2);margin-bottom:7px;line-height:1.5;}
.nchip.picker{background:var(--blue-dim);border-color:rgba(59,130,246,0.18);}
.nchip-lbl{font-weight:700;margin-left:3px;}
.ocard-acts{display:flex;gap:7px;flex-wrap:wrap;}

/* FILTER */
.fbar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.fchip{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;border:1.5px solid var(--border2);background:var(--card);color:var(--text3);cursor:pointer;font-family:'Heebo',sans-serif;transition:all 0.18s;white-space:nowrap;}
.fchip.on{background:var(--gold);color:#000;border-color:var(--gold);}

/* ALERTS */
.al-card{
  background:var(--card);border:1px solid rgba(239,68,68,0.22);
  border-radius:12px;padding:13px;margin-bottom:9px;
  display:flex;align-items:flex-start;gap:10px;
}
.al-icon{font-size:20px;flex-shrink:0;margin-top:1px;}
.al-title{font-size:12px;font-weight:800;color:var(--red);}
.al-body{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.6;}

/* TOP 10 */
.t10-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);}
.t10-row:last-child{border-bottom:none;}
.t10-rank{font-size:16px;font-weight:900;color:var(--text3);width:24px;text-align:center;flex-shrink:0;}
.t10-rank.g{color:var(--gold);}
.t10-rank.s{color:#94a3b8;}
.t10-rank.b{color:#b45309;}
.t10-info{flex:1;min-width:0;}
.t10-chain{font-size:12px;font-weight:800;color:var(--gold);}
.t10-loc{font-size:10px;color:var(--text2);margin-top:1px;}
.t10-bar-wrap{width:60px;flex-shrink:0;}
.t10-bar{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));}
.t10-cnt{font-size:13px;font-weight:900;width:20px;text-align:center;flex-shrink:0;}

/* SCHEDULE */
.sched{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
.sday{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border);gap:9px;}
.sday:last-child{border-bottom:none;}
.sday.today{background:var(--gold-dim);}
.sd-name{font-weight:800;font-size:12px;width:50px;flex-shrink:0;color:var(--text2);}
.today-tag{font-size:8px;font-weight:800;background:var(--gold);color:#000;padding:2px 5px;border-radius:5px;}
.sd-zones{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.sd-zone{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--bg2);color:var(--text2);border:1px solid var(--border2);}

/* DRIVER */
.route-hero{
  background:linear-gradient(135deg,var(--card2),var(--card));
  border:1px solid var(--border2);border-radius:var(--r);
  padding:20px 15px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden;
}
.rh-glow{position:absolute;top:-50px;left:50%;transform:translateX(-50%);width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,0.1) 0%,transparent 70%);}
.rh-day{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;position:relative;}
.rh-zone{font-size:20px;font-weight:900;color:var(--gold);margin-top:5px;position:relative;}
.rh-stats{display:flex;justify-content:center;gap:28px;margin-top:12px;position:relative;}
.rhs{text-align:center;}
.rhs-n{font-size:30px;font-weight:900;line-height:1;}
.rhs-l{font-size:9px;color:var(--text3);margin-top:2px;text-transform:uppercase;}
.del-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:8px;display:flex;align-items:center;gap:11px;cursor:pointer;}
.del-num{font-size:18px;font-weight:900;color:var(--text3);width:26px;text-align:center;flex-shrink:0;}
.del-info{flex:1;min-width:0;}
.del-chain{font-size:16px;font-weight:800;color:var(--gold);}
.del-city{font-size:14px;font-weight:600;margin-top:1px;}
.del-addr{font-size:10px;color:var(--text3);}
.del-pals{text-align:center;flex-shrink:0;}
.del-pn{font-size:20px;font-weight:900;line-height:1;}
.del-pl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.del-exp{display:none;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);}

/* DATA ROW */
.drow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.drow:last-child{border-bottom:none;}
.drow-lbl{font-size:12px;font-weight:600;}
.drow-val{font-size:16px;font-weight:900;}

/* INFO BANNER */
.info-banner{background:var(--gold-dim);border:1px solid var(--gold-glow);border-radius:9px;padding:9px 12px;font-size:11px;color:var(--text2);margin-bottom:12px;line-height:1.6;}
.info-banner strong{color:var(--gold);}

/* CITY DROPDOWN */
.city-wrap{position:relative;}
.city-dropdown{
  position:absolute;top:calc(100% + 4px);right:0;left:0;
  background:var(--card2);border:1.5px solid var(--gold);
  border-radius:var(--rs);z-index:300;max-height:220px;overflow-y:auto;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);display:none;
}
.city-dropdown.open{display:block;}
.city-opt{
  padding:11px 13px;font-size:14px;cursor:pointer;
  border-bottom:1px solid var(--border);color:var(--text);
  transition:background 0.15s;
}
.city-opt:last-child{border-bottom:none;}
.city-opt:hover,.city-opt.focused{background:var(--gold-dim);color:var(--gold);}
.city-opt mark{background:transparent;color:var(--gold);font-weight:800;}

/* BRANCH DROPDOWN */
.branch-wrap{position:relative;}
.branch-dropdown{
  position:absolute;top:calc(100% + 4px);right:0;left:0;
  background:var(--card2);border:1.5px solid var(--blue);
  border-radius:var(--rs);z-index:300;max-height:200px;overflow-y:auto;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);display:none;
}
.branch-dropdown.open{display:block;}
.branch-opt{
  padding:10px 13px;font-size:13px;cursor:pointer;
  border-bottom:1px solid var(--border);color:var(--text);transition:background 0.15s;
}
.branch-opt:last-child{border-bottom:none;}
.branch-opt:hover{background:var(--blue-dim);color:var(--blue);}
.branch-opt .bo-city{font-size:10px;color:var(--text3);margin-top:2px;}

/* WEEKLY BOARD */
.wboard { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.wday-col {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--r); overflow:hidden;
}
.wday-header {
  padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
  background:var(--card2); border-bottom:1px solid var(--border);
  cursor:pointer;
}
.wday-header.today { background:rgba(245,158,11,0.1); border-bottom-color:rgba(245,158,11,0.3); }
.wday-name { font-size:15px; font-weight:900; }
.wday-stats { display:flex; gap:10px; font-size:12px; }
.wday-stat { display:flex; align-items:center; gap:4px; font-weight:700; }
.wday-orders { padding:8px; display:none; }
.wday-orders.open { display:block; }
.worder-row {
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:9px; margin-bottom:6px;
  border-right:4px solid transparent;
  background:var(--bg2);
}
.worder-row.ws-new { border-right-color:var(--red); }
.worder-row.ws-picking { border-right-color:var(--gold); }
.worder-row.ws-done { border-right-color:var(--green); }
.worder-row.ws-loaded { border-right-color:var(--orange); }
.wo-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.wo-dot-new { background:var(--red); box-shadow:0 0 6px var(--red); }
.wo-dot-picking { background:var(--gold); box-shadow:0 0 6px var(--gold); }
.wo-dot-done { background:var(--green); box-shadow:0 0 6px var(--green); }
.wo-dot-loaded { background:var(--orange); }
.wo-info { flex:1; min-width:0; }
.wo-chain { font-size:14px; font-weight:800; }
.wo-city { font-size:12px; color:var(--text2); }
.wo-zone { font-size:10px; color:var(--purple); font-weight:700; }
.wo-pals { font-size:16px; font-weight:900; text-align:center; flex-shrink:0; }
.wo-pals-lbl { font-size:9px; color:var(--text3); text-align:center; }
.wo-status { font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; flex-shrink:0; }
.wos-new { background:rgba(239,68,68,0.15); color:var(--red); }
.wos-picking { background:rgba(245,158,11,0.15); color:var(--gold); }
.wos-done { background:rgba(16,185,129,0.15); color:var(--green); }
.wos-loaded { background:rgba(249,115,22,0.15); color:var(--orange); }

/* SPECIAL ROWS */
.wday-special {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--r); overflow:hidden; margin-bottom:10px;
}
.wday-special-header {
  padding:10px 14px; background:rgba(139,92,246,0.1);
  border-bottom:1px solid rgba(139,92,246,0.2);
  font-size:14px; font-weight:900; color:var(--purple);
  display:flex; align-items:center; gap:8px; cursor:pointer;
}
.urgent-row {
  background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.3);
  border-radius:9px; padding:9px 12px; margin:8px;
  display:flex; align-items:center; gap:10px;
}
.urgent-badge { font-size:10px; font-weight:800; background:var(--red); color:#fff; padding:2px 8px; border-radius:20px; }

/* LABEL PRINT */
@media print {
  body > *:not(#printFrame) { display:none !important; }
  #printFrame { display:block !important; }
}
.print-label {
  font-family:'Heebo',Arial,sans-serif; direction:rtl;
  border:3px solid #000; border-radius:12px;
  padding:24px; max-width:100%; margin:0 auto;
}
.pl-logo { font-size:26px; font-weight:900; letter-spacing:3px; text-align:center; margin-bottom:14px; }
.pl-chain { font-size:36px; font-weight:900; line-height:1.1; }
.pl-city { font-size:28px; font-weight:700; margin-top:6px; }
.pl-addr { font-size:22px; color:#444; margin-top:4px; }
.pl-zone { font-size:18px; color:#666; margin-top:12px; border-top:1px solid #ccc; padding-top:10px; }
.pl-agent { font-size:16px; color:#888; margin-top:4px; }
.pl-date { font-size:14px; color:#aaa; margin-top:2px; }

/* HORIZONTAL WEEKLY TABLE */
.wtable-wrap {
  overflow-x: auto; margin-bottom: 14px;
  border-radius: var(--r); border: 1px solid var(--border);
}
.wtable {
  width: 100%; border-collapse: collapse; min-width: 700px;
  font-family: 'Heebo', sans-serif; direction: rtl;
}
.wtable th {
  padding: 10px 8px; font-size: 12px; font-weight: 800;
  text-align: center; border-bottom: 2px solid var(--border);
  background: var(--card2); white-space: nowrap; position: sticky; top: 0;
}
.wtable th.today-col { background: rgba(245,158,11,0.12); color: var(--gold); }
.wtable th.notes-col { background: rgba(139,92,246,0.1); color: var(--purple); }
.wtable th.urgent-col { background: rgba(239,68,68,0.1); color: var(--red); }
.wtable td {
  padding: 6px 6px; vertical-align: top;
  border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
  font-size: 12px; background: var(--card);
}
.wtable td:last-child { border-left: none; }
.wtable tr:last-child td { border-bottom: none; }
.wtable td.notes-col { background: rgba(139,92,246,0.04); }
.wtable td.urgent-col { background: rgba(239,68,68,0.04); }
.wt-order {
  border-radius: 7px; padding: 7px 8px; margin-bottom: 5px;
  border-right: 3px solid transparent; font-size: 11px;
  cursor: pointer; transition: opacity 0.15s;
}
.wt-order:hover { opacity: 0.85; }
.wt-order.ws-new { background: rgba(239,68,68,0.1); border-right-color: var(--red); }
.wt-order.ws-picking { background: rgba(245,158,11,0.1); border-right-color: var(--gold); }
.wt-order.ws-done { background: rgba(16,185,129,0.1); border-right-color: var(--green); }
.wt-order.ws-loaded { background: rgba(249,115,22,0.1); border-right-color: var(--orange); }
.wt-chain { font-size: 12px; font-weight: 800; color: var(--gold); }
.wt-city { font-size: 11px; color: var(--text2); margin-top: 1px; }
.wt-pal { font-size: 10px; font-weight: 700; color: var(--text3); }
.wt-status { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 20px; display: inline-block; margin-top: 2px; }
.wts-new { background: rgba(239,68,68,0.15); color: var(--red); }
.wts-picking { background: rgba(245,158,11,0.15); color: var(--gold); }
.wts-done { background: rgba(16,185,129,0.15); color: var(--green); }
.wts-loaded { background: rgba(249,115,22,0.15); color: var(--orange); }
.wt-col-header-sub { font-size: 10px; font-weight: 400; color: var(--text3); margin-top: 2px; }
.wt-col-total { font-size: 10px; color: var(--text3); text-align: center; padding: 5px; background: var(--bg2); border-top: 1px solid var(--border); }
.wt-note-item { border-radius: 7px; padding: 7px 8px; margin-bottom: 5px; background: rgba(139,92,246,0.08); border-right: 3px solid var(--purple); font-size: 11px; }
.wt-urgent-item { border-radius: 7px; padding: 7px 8px; margin-bottom: 5px; background: rgba(239,68,68,0.08); border-right: 3px solid var(--red); font-size: 11px; }
.wt-empty { color: var(--text3); font-size: 11px; text-align: center; padding: 12px 4px; }

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:500;align-items:flex-end;backdrop-filter:blur(3px);}
.modal-ov.open{display:flex;}
.modal{background:var(--card);border-radius:18px 18px 0 0;padding:22px 16px;width:100%;border-top:2px solid var(--gold);animation:slideUp 0.22s ease;}
@keyframes slideUp{from{transform:translateY(36px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:16px;font-weight:900;margin-bottom:13px;}
.modal-acts{display:flex;gap:7px;margin-top:12px;}

/* TOAST */
.toast{
  position:fixed;bottom:26px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--green);color:#fff;
  font-weight:700;font-size:13px;padding:11px 22px;
  border-radius:11px;z-index:999;
  transition:transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--red);}
.toast.warn{background:var(--orange);}

/* EMPTY */
.empty{text-align:center;padding:44px 18px;color:var(--text3);}
.empty-i{font-size:44px;margin-bottom:10px;}
.empty-t{font-size:14px;font-weight:700;color:var(--text2);}
.empty-s{font-size:11px;margin-top:4px;}
</style>
</head>

// Firebase REST helpers
async function fbLoad(){
  try{
    const r = await fetch(FB_URL+".json");
    const data = await r.json();
    if(!data) return [];
    return Object.entries(data).map(([fbKey,o])=>{o._fbKey=fbKey;return o;});
  }catch(e){console.error("FB load error",e);return [];}
}
async function fbSave(orders){
  try{
    // Build object keyed by order id
    const obj={};
    orders.forEach(o=>{
      const key=o._fbKey||o.id;
      const clean={...o}; delete clean._fbKey;
      obj[key]=clean;
    });
    await fetch(FB_URL+".json",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(obj)
    });
  }catch(e){console.error("FB save error",e);}
}
async function fbPush(order){
  try{
    const clean={...order}; delete clean._fbKey;
    const r=await fetch(FB_URL+".json",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(clean)
    });
    const data=await r.json();
    return data.name; // firebase key
  }catch(e){console.error("FB push error",e);return null;}
}
async function fbDelete(fbKey){
  try{
    await fetch(FB_URL+"/"+fbKey+".json",{method:"DELETE"});
  }catch(e){console.error("FB delete error",e);}
}
async function fbPatch(fbKey,patch){
  try{
    await fetch(FB_URL+"/"+fbKey+".json",{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(patch)
    });
  }catch(e){console.error("FB patch error",e);}
}

function msFromStr(s){
  if(!s) return null;
  // Try parse Israeli date "d.m.yyyy, hh:mm:ss"

}

// ALERTS — only computed for manager/warehouse
// ════════════════════════════════
function computeAlerts(orders){
  const alerts=[];

  // 1. הזמנות שלא טופלו מעל STALE_DAYS ימים
  const stale=orders.filter(o=>{
    if(o.status!=="new"&&o.status!=="picking") return false;
    const ms=o.createdMs||msFromStr(o.createdAt);
    if(!ms) return false; // אין תאריך תקין — לא מציג התראה
    return daysDiff(ms)>=STALE_DAYS;
  });
  if(stale.length){
    alerts.push({
      icon:"⏰",
      title:`${stale.length} הזמנה${stale.length>1?"ות":""} לא טופלו מעל ${STALE_DAYS} ימים`,
      body:stale.map(o=>`• ${o.chain} | ${o.city} | ${o.agentName}`).join("\n")
    });
  }

  // 2. סניפים לא פעילים מעל INACTIVE_DAYS
  // Only check orders that have a valid createdMs (new orders from the app)
  const MIN_MS = Date.now() - (90 * 86400000); // only consider last 90 days
  const latest={};
  for(const o of orders){
    const key=o.chain+"|"+o.city;
    const ms=o.createdMs||0;
    if(!ms||ms<MIN_MS) continue; // skip old/invalid orders
    if(!latest[key]||ms>latest[key].ms) latest[key]={ms,chain:o.chain,city:o.city};
  }
  const inactive=Object.values(latest).filter(b=>b.ms&&daysDiff(b.ms)>=INACTIVE_DAYS);
  if(inactive.length){
    alerts.push({
      icon:"🔕",
      title:`${inactive.length} סניף${inactive.length>1?"ים":""} לא הזמינו מעל ${INACTIVE_DAYS} יום`,
      body:inactive.slice(0,6).map(b=>`• ${b.chain} – ${b.city}`).join("\n")+(inactive.length>6?`\n+ ${inactive.length-6} נוספים`:"")
    });
  }
  return alerts;
}

function refreshAlertBanner(){
  const banner=document.getElementById("alertBanner");

  if(!banner||!txt) return;
  // Only show for manager/warehouse — never for agent or driver
  if(role!=="manager"&&role!=="warehouse"){ banner.classList.remove("show"); return; }
  const alerts=computeAlerts(load());
  if(!alerts.length){ banner.classList.remove("show"); return; }
  const total=alerts.reduce((s,a)=>{const m=a.title.match(/^(\d+)/);return s+(m?+m[1]:1);},0);
  txt.textContent=`⚠️  ${total} התראה${total>1?"ות":""} פעילות — לחץ לפרטים`;
  banner.classList.add("show");
}

let sseSource=null;

function startRf(){
  stopRf();
  // Try SSE for real-time updates
  try{
    sseSource=new EventSource("https://gada-2027-default-rtdb.europe-west1.firebasedatabase.app/orders.json");
    sseSource.addEventListener("put",async (e)=>{
      const data=JSON.parse(e.data);
      if(!data||!data.data) return;
      const orders=Object.entries(data.data).map(([k,o])=>{o._fbKey=k;return o;});
      localStorage.setItem(SK,JSON.stringify(orders));
      const h=hashArr(orders);
      refreshAlertBanner();
      if(h!==lastH){
        lastH=h;
        if(!document.getElementById("modalOv").classList.contains("open")) renderRole(role);
      }
    });
    sseSource.addEventListener("patch",async ()=>{
      const fresh=await fbLoad();
      localStorage.setItem(SK,JSON.stringify(fresh));
      const h=hashArr(fresh);
      refreshAlertBanner();
      if(h!==lastH){
        lastH=h;
        if(!document.getElementById("modalOv").classList.contains("open")) renderRole(role);
      }
    });
    sseSource.onerror=()=>{
      // SSE failed, fallback to polling
      if(sseSource){ sseSource.close(); sseSource=null; }
      startPolling();
    };
  }catch(e){
    startPolling();
  }
}

function startPolling(){
  if(rfTmr) clearInterval(rfTmr);
  rfTmr=setInterval(async()=>{
    const fresh=await loadAsync();
    const h=hashArr(fresh);
    refreshAlertBanner();
    if(h!==lastH){
      lastH=h;
      if(!document.getElementById("modalOv").classList.contains("open")) renderRole(role);
    }
  },4000);
}

function stopRf(){
  if(rfTmr){clearInterval(rfTmr);rfTmr=null;}
  if(sseSource){sseSource.close();sseSource=null;}
}

async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

  if(!checkRateLimit()) return;
  const user=(document.getElementById("loginUser")?.value||"").trim();

  const errEl=document.getElementById("loginErr");
  if(!user||!pass){ if(errEl) errEl.textContent="הזן שם משתמש וסיסמה"; return; }
  const passHash = await sha256(pass);
  const found=USERS.find(u=>u.user===user && u.hash===passHash);
  if(!found){

    if(errEl){ errEl.textContent="שם משתמש או סיסמה שגויים ❌"; }
    const p=document.getElementById("loginPass"); if(p){ p.value=""; p.focus(); }
    return;
  }
  recordLoginAttempt(true);
  resetActivity();
  if(errEl) errEl.textContent="";
  if(found.role==="agent") agent=found.name;
  enter(found.role);
  setTimeout(runMaintenance, 3000);
}

function branchSearch(val){
  const dd = document.getElementById("branchDD");
  if(!dd) return;
  const chain = document.getElementById("fChain")?.value || "";
  const city  = document.getElementById("fCity")?.value.trim() || "";
  const q     = val.trim();

  // Must have chain selected
  if(!chain){ dd.classList.remove("open"); return; }
  // Must have at least 1 char typed OR city selected
  if(!q && !city){ dd.classList.remove("open"); return; }

  let pool = BRANCHES[chain] || [];

  // Filter by city if city is filled
  if(city) pool = pool.filter(b => b.city.includes(city) || city.includes(b.city));

  // Filter by typed text
  if(q) pool = pool.filter(b => b.address.includes(q) || b.city.includes(q));

  if(pool.length === 0){ dd.classList.remove("open"); return; }

  dd.innerHTML = pool.slice(0,20).map(b => {
    const hiAddr = q ? b.address.replace(new RegExp(q,"g"),`<mark style="background:transparent;color:var(--gold);font-weight:800">${q}</mark>`) : b.address;
    return `<div class="branch-opt" data-addr="${b.address.replace(/"/g,'&quot;')}" data-city="${b.city.replace(/"/g,'&quot;')}" onmousedown="pickBranchEl(this)">
      ${hiAddr}
      <div class="bo-city">📍 ${b.city}</div>
    </div>`;
  }).join("");
  dd.classList.add("open");
}

function pickBranch(address, city){
  const addrInp = document.getElementById("fAddr");
  const cityInp = document.getElementById("fCity");
  if(addrInp) addrInp.value = address;
  // Also fill city if empty
  if(cityInp && !cityInp.value) { cityInp.value = city; updateZoneHint(); }
  closeBranchDD();
}

function pickBranchEl(el){
  const addr = el.getAttribute("data-addr");
  const city = el.getAttribute("data-city");
  pickBranch(addr, city);
}
function pickCityEl(el){
  const city = el.getAttribute("data-city");
  pickCity(city);
}
function closeBranchDD(){
  const dd = document.getElementById("branchDD");
  if(dd) dd.classList.remove("open");
}

function citySearch(val){
  const dd = document.getElementById("cityDD");
  if(!dd) return;
  const q = val.trim();
  // Show all cities if empty, filter if has text
  const filtered = q.length === 0
    ? CITIES
    : CITIES.filter(c => c.includes(q));
  if(filtered.length === 0){ dd.classList.remove("open"); return; }
  dd.innerHTML = filtered.slice(0,80).map(c=>{
    const hi = q ? c.replace(new RegExp(q,'g'), `<mark>${q}</mark>`) : c;
    return `<div class="city-opt" data-city="${c.replace(/"/g,'&quot;')}" onmousedown="pickCityEl(this)">${hi}</div>`;
  }).join("");
  dd.classList.add("open");
}
function pickCity(city){
  const inp = document.getElementById("fCity");
  if(inp){ inp.value = city; }
  closeCityDD();
  updateZoneHint();
}
function closeCityDD(){
  const dd = document.getElementById("cityDD");
  if(dd) dd.classList.remove("open");
}

function updateZoneHint(){
  const city = document.getElementById("fCity")?.value.trim() || "";
  const hint = document.getElementById("zoneHint");
  const hName = document.getElementById("zoneHintName");
  const hDay  = document.getElementById("zoneHintDay");
  if(!hint||!hName||!hDay) return;
  if(!city){ hint.style.display="none"; return; }

  const zone = getZone(city);
  if(zone === "לא שובץ"){
    hint.style.display = "block";
    hName.textContent = "עיר לא מזוהה";
    hName.style.color = "var(--text3)";
    hDay.textContent  = "בדוק את שם העיר";
    document.getElementById("zoneHintIcon").textContent = "❓";
    return;
  }

  const zData = ZONES[zone];
  const days  = zData ? zData.days : [];
  const dayIcons = {"ראשון":"1️⃣","שני":"2️⃣","שלישי":"3️⃣","רביעי":"4️⃣","חמישי":"5️⃣"};
  const daysStr = days.map(d => `יום ${d}`).join(" + ");

  hint.style.display = "block";
  hName.textContent  = zone;
  hName.style.color  = "var(--gold)";
  hDay.textContent   = `📅 ${daysStr}`;
  document.getElementById("zoneHintIcon").textContent = "🗺️";
}

function submitOrder(){
  const chain=document.getElementById("fChain").value;
  const city=document.getElementById("fCity").value.trim();
  const addr=document.getElementById("fAddr").value.trim();
  const notes=document.getElementById("fNotes").value.trim();
  if(!chain){ toast("בחר רשת","err"); return; }
  if(!city){ toast("הזן עיר","err"); return; }
  if(!addr){ toast("הזן כתובת","err"); return; }
  let orders=load();
  const needArranger = arrangerNeeded;
  const arrangerDate = needArranger ? (document.getElementById("fArrangerDate")?.value||"") : "";
  const arrangerNote = needArranger ? (document.getElementById("fArrangerNote")?.value.trim()||"") : "";
  const newOrder={id:uid(),agentName:agent,chain,city,branch:addr,notes,
    zone:getZone(city),status:"new",pallets:0,
    createdAt:nowStr(),createdMs:nowMs(),
    pickerName:"",pickedAt:"",pickerNote:"",loadedAt:"",
    needArranger,arrangerDate,arrangerNote,
    arrangerName:"",arrangerAssignedAt:""};
  arrangerNeeded=false;
  // Push to Firebase
  fbPush(newOrder).then(fbKey=>{
    toast(`✅ ${chain} ${city} – נשלח!`);
  });
  // Also update local immediately for UX
  orders=load();
  orders.push(newOrder);
  save(orders);
  atab=1; renderRole("agent");
}

function getZonesForDay(dayName){
  return Object.entries(ZONES).filter(([,d])=>d.days.includes(dayName)).map(([z])=>z);
}
function getDayName(offsetDays){
  const d=new Date(); d.setDate(d.getDate()+offsetDays);
  return ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"][d.getDay()];
}
function getDateStr(offsetDays){
  const d=new Date(); d.setDate(d.getDate()+offsetDays);
  return d.toLocaleDateString("he-IL");
}
function getDateObj(offsetDays){
  const d=new Date(); d.setDate(d.getDate()+offsetDays);
  return d;
}

function rDriver(){
  const orders=load();

  const tz=todayZones();
  const ready=orders.filter(o=>o.status==="done"&&tz.includes(o.zone));
  const totalPal=ready.reduce((s,o)=>s+(o.pallets||0),0);

  // Build work week (today + next 4 work days)
  const weekDays=[];
  let offset=0;
  while(weekDays.length<5 && offset<10){
    const dn=getDayName(offset);
    if(dn!=="שבת"&&dn!=="שישי"){
      const zones=getZonesForDay(dn);
      const dayOrders=orders.filter(o=>zones.includes(o.zone));
      const doneO=dayOrders.filter(o=>o.status==="done"||o.status==="loaded");
      const pendO=dayOrders.filter(o=>o.status==="new"||o.status==="picking");
      const pals=doneO.reduce((s,o)=>s+(o.pallets||0),0);
      weekDays.push({dn,dateStr:getDateStr(offset),zones,doneO,pendO,pals,isToday:offset===0});
    }
    offset++;
  }

  return `
  <div class="tabs">

function rArrangerTab(orders){
  const arrangerOrders = orders.filter(o=>o.needArranger);
  const unassigned = arrangerOrders.filter(o=>!o.arrangerName);
  const assigned = arrangerOrders.filter(o=>o.arrangerName);
  const byDate = {};
  assigned.forEach(o=>{
    const k=o.arrangerDate||"ללא תאריך";
    if(!byDate[k]) byDate[k]=[];
    byDate[k].push(o);
  });
  return `
  <div class="card" style="margin-bottom:10px">
    <div class="card-title"><h3>🔔 ממתינים לשיבוץ סדרן</h3><span class="sec-badge">${unassigned.length}</span></div>
    ${unassigned.length===0
      ?`<div style="color:var(--text3);font-size:12px;text-align:center;padding:10px">הכל משובץ ✓</div>`
      :unassigned.map(o=>`
      <div style="background:var(--bg2);border:1px solid rgba(245,158,11,0.25);border-radius:10px;padding:12px;margin-bottom:8px">
        <div style="font-size:13px;font-weight:800;color:var(--gold)">${o.chain}</div>
        <div style="font-size:12px">📍 ${o.city} · ${o.branch||""}</div>

function markLoaded(id,e){
  e.stopPropagation();
  const orders=load(); const o=orders.find(x=>x.id===id); if(!o)return;
  o.status="loaded"; o.loadedAt=nowStr(); o.loadedMs=nowMs(); save(orders);
  if(o._fbKey) fbPatch(o._fbKey,{status:"loaded",loadedAt:o.loadedAt,loadedMs:o.loadedMs});
  toast("✅ העמסה אושרה!"); renderRole(role);
}

function archiveOldOrders(){
  // Move loaded orders older than 30 days to archive, keep last 30 days
  const THIRTY_DAYS = 30 * 86400000;
  const orders = load();
  const now = Date.now();
  const active = [];
  const toArchive = [];
  orders.forEach(o=>{
    const loadedMs = o.loadedMs || 0;
    if(o.status==="loaded" && loadedMs && (now-loadedMs) > THIRTY_DAYS){
      toArchive.push(o);
    } else {
      active.push(o);
    }
  });
  if(toArchive.length>0){
    // Save archive by month
    const month = new Date().toISOString().slice(0,7);
    const archiveKey = "gada_archive_"+month;
    const existing = JSON.parse(localStorage.getItem(archiveKey)||"[]");
    localStorage.setItem(archiveKey, JSON.stringify([...existing, ...toArchive]));
    save(active);
    // Also delete from Firebase
    toArchive.forEach(o=>{ if(o._fbKey) fbDelete(o._fbKey); });
    console.log(`✅ ארכוב: ${toArchive.length} הזמנות עברו לארכיון ${month}`);
  }
}

// Run archive check every login
function runMaintenance(){
  archiveOldOrders();
  doBackup();
}

function doFinish(id){
  const pal=parseInt(document.getElementById("palIn")?.value)||0;
  const note=document.getElementById("noteIn")?.value.trim()||"";
  if(pal<1){toast("הזן מספר משטחים","err");return;}
  const orders=load(); const o=orders.find(x=>x.id===id); if(!o)return;
  o.status="done"; o.pallets=pal; o.pickedAt=nowStr(); o.pickerNote=note;
  save(orders);
  if(o._fbKey) fbPatch(o._fbKey,{status:"done",pallets:pal,pickedAt:o.pickedAt,pickerNote:note});
  closeModal(); toast(`✅ לקוט! ${pal} משטחים`); renderRole(role);
}
function delOrder(id){
  const orders=load();
  const o=orders.find(x=>x.id===id);
  if(o&&o._fbKey) fbDelete(o._fbKey);
  const filtered=orders.filter(x=>x.id!==id);
  save(filtered); toast("נמחק","err"); renderRole(role);
}

async function runAI(){
  const orders=load();
  const done=orders.filter(o=>o.status==="done");
  if(done.length===0){ toast("אין הזמנות לקוטות","err"); return; }
  
  aiLoading=true; aiResult=""; renderRole("manager");

  const tomorrow=getDayName(1);
  const tomorrowZones=getZonesForDay(tomorrow);
  
  // Build summary
  const byZone={};
  done.forEach(o=>{
    if(!byZone[o.zone]) byZone[o.zone]={pals:0,orders:[]};
    byZone[o.zone].pals+=o.pallets||0;
    byZone[o.zone].orders.push({chain:o.chain,city:o.city,pals:o.pallets||0});
  });

  const zonesSummary = Object.entries(byZone).map(([z,d])=>
    `• ${z}: ${d.pals} משטחים (${d.orders.map(o=>`${o.chain} ${o.city}`).join(", ")})`
  ).join("\n");

  const prompt = `אתה מנהל לוגיסטיקה של חברת הפצה ישראלית בשם GADA GROUP.
יש לי משאית שצריכה לצאת עם 10 משטחים. המחסן בקצרין.

הזמנות מוכנות לפי אזורים:
${zonesSummary}

קו ההפצה למחר (${tomorrow}): ${tomorrowZones.join(", ")||"לא הוגדר"}

אנא:
1. הצע אילו אזורים לשלב כדי להגיע ל-10 משטחים
2. תן עדיפות לקו מחר ואז לאזורים קרובים גיאוגרפית
3. הסבר קצר למה
4. תוכנית עומס סופית ברורה

ענה בעברית, קצר וברור.`;

  // Use local analysis (CORS blocks direct API calls from browser)
  aiResult = localRouteAnalysis(byZone, tomorrowZones, tomorrow);
  aiLoading=false;
  renderRole("manager");
}

function clearAI(){ aiResult=""; renderRole("manager"); }

function localRouteAnalysis(byZone, tomorrowZones, tomorrow){
  const TARGET = 10;
  const zones = Object.entries(byZone).map(([z,d])=>({zone:z,pals:d.pals,orders:d.orders.length}));
  zones.sort((a,b)=>b.pals-a.pals);

  // Geographic proximity map
  const PROXIMITY = {
    "נגב ודרום":       ["דרום קרוב","שפלה ודרום מרכז","ירושלים והסביבה"],
    "דרום קרוב":       ["נגב ודרום","מרכז ושפלה","שפלה ודרום מרכז"],
    "מרכז ושפלה":      ["דרום קרוב","שרון","ירושלים והסביבה"],
    "שרון":            ["מרכז ושפלה","גליל תחתון","חיפה והכרמל"],
    "ירושלים והסביבה": ["מרכז ושפלה","נגב ודרום","דרום קרוב"],
    "גליל תחתון":      ["שרון","צפון עמוק","גליל והגולן"],
    "צפון עמוק":       ["גליל תחתון","גליל והגולן"],
    "גליל והגולן":     ["גליל תחתון","צפון עמוק"],
  };

  let result = "📊 ניתוח מקומי (ללא AI)\n\n";
  let totalPals = zones.reduce((s,z)=>s+z.pals,0);
  result += `סה"כ משטחים מוכנים: ${totalPals}\n`;
  result += `יעד: ${TARGET} משטחים למשאית\n\n`;

  // Priority: tomorrow's zones first
  const tomorrowReady = zones.filter(z=>tomorrowZones.includes(z.zone));
  const otherZones = zones.filter(z=>!tomorrowZones.includes(z.zone));

  result += `📅 קו מחר (${tomorrow}):\n`;
  if(tomorrowReady.length===0){
    result += "• אין הזמנות מוכנות לקו מחר\n";
  } else {
    let palsSoFar = 0;
    tomorrowReady.forEach(z=>{
      result += `• ${ZONE_INFO[z.zone]?.emoji||"🗺️"} ${z.zone}: ${z.pals} משטחים (${z.orders} הזמנות)\n`;
      palsSoFar += z.pals;
    });
    result += `  סכום: ${palsSoFar}/${TARGET} משטחים\n\n`;

    if(palsSoFar < TARGET){
      const needed = TARGET - palsSoFar;
      result += `⚠️ חסרים ${needed} משטחים — מחפש אזורים קרובים:\n`;
      
      // Find closest zones to tomorrow's zones
      const candidates = [];
      tomorrowZones.forEach(tz=>{
        const nearby = PROXIMITY[tz]||[];
        nearby.forEach(nz=>{
          const found = otherZones.find(z=>z.zone===nz);
          if(found && !candidates.find(c=>c.zone===nz)) candidates.push(found);
        });
      });

      if(candidates.length>0){
        result += "\n💡 המלצה לאיחוד:\n";
        let added = 0;
        candidates.forEach(c=>{
          if(added < needed){
            result += `• הוסף ${ZONE_INFO[c.zone]?.emoji||"🗺️"} ${c.zone}: ${c.pals} משטחים (${c.orders} הזמנות)\n`;
            added += c.pals;
          }
        });
        result += `\n✅ סה"כ משוער: ${palsSoFar+added} משטחים`;
      } else {
        result += "• אין אזורים קרובים זמינים לאיחוד";
      }
    } else {
      result += `✅ מספיק משטחים לקו מחר!`;
    }
  }
  return result;
}

function wDotCls(s){ return{new:"wo-dot-new",picking:"wo-dot-picking",done:"wo-dot-done",loaded:"wo-dot-loaded"}[s]||""; }
function wRowCls(s){ return{new:"ws-new",picking:"ws-picking",done:"ws-done",loaded:"ws-loaded"}[s]||""; }
function wStatusLbl(s){ return{new:"🔴 לא נגעו",picking:"🟡 בלקיטה",done:"✅ מוכן",loaded:"🚛 נשלח"}[s]||s; }
function wStatusCls(s){ return{new:"wts-new",picking:"wts-picking",done:"wts-done",loaded:"wts-loaded"}[s]||""; }

function rWeeklyBoard(orders){
  const WDAYS = ["ראשון","שני","שלישי","רביעי","חמישי"];
  const today = todayDay();

  // Build data per day (א-ה only, no Friday/Saturday)
  const dayData = WDAYS.map(day=>{
    const zones = (day==="שישי"||day==="שבת") ? [] : getZonesForDay(day);
    const dayOrders = orders.filter(o=>zones.includes(o.zone));
    return { day, zones, orders: dayOrders };
  });

  // Notes column - all orders with notes
  const withNotes = orders.filter(o=>o.notes||o.pickerNote||o.arrangerNote);

  // Urgent column - orders not touched > 3 days or marked urgent
  const urgent = orders.filter(o=>{
    if(o.status==="loaded") return false;
    const ms=o.createdMs||0;
    return ms && daysDiff(ms)>=3;
  });

  // Max rows = max orders in any column
  const maxRows = Math.max(1, ...dayData.map(d=>d.orders.length), withNotes.length, urgent.length);

  // Render order card in table cell
  function renderWTOrder(o){
    if(!o) return "";
    return `<div class="wt-order ${wRowCls(o.status)}" onclick="startPickW('${o.id}',event)">
      <div class="wt-chain">${o.chain}</div>
      <div class="wt-city">📍 ${o.city}</div>
      <div class="wt-pal">${o.pallets>0?o.pallets+"📦":""} ${o.agentName}</div>
      <span class="wt-status ${wStatusCls(o.status)}">${wStatusLbl(o.status)}</span>
    </div>`;
  }

  function colTotal(dayOrders){
    const pals = dayOrders.reduce((s,o)=>s+(o.pallets||0),0);
    const cnt = {new:0,picking:0,done:0,loaded:0};
    dayOrders.forEach(o=>{if(cnt[o.status]!==undefined)cnt[o.status]++;});
    return `${dayOrders.length} הזמנות · ${pals}📦
      ${cnt.new?`🔴${cnt.new} `:""}${cnt.picking?`🟡${cnt.picking} `:""}${cnt.done?`✅${cnt.done} `:""}${cnt.loaded?`🚛${cnt.loaded}`:""}`;
  }

  return `
  <div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text2)">
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block"></span>לא נגעו</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block"></span>בלקיטה</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block"></span>מוכן</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--orange);display:inline-block"></span>נשלח</span>
  </div>
  <div class="wtable-wrap">
    <table class="wtable">
      <thead>
        <tr>
          ${dayData.map(d=>`
          <th class="${d.day===today?"today-col":""}">
            ${d.day===today?`<span style="background:var(--gold);color:#000;padding:1px 6px;border-radius:6px;font-size:10px">היום</span><br/>`:""}
            ${d.day}
            <div class="wt-col-header-sub">${d.zones.join(" · ")||"—"}</div>
          </th>`).join("")}
          <th class="notes-col">📝 הערות<div class="wt-col-header-sub">${withNotes.length} הזמנות</div></th>
          <th class="urgent-col">🚨 יוצא בצ'יטה<div class="wt-col-header-sub">${urgent.length} דחופות</div></th>
        </tr>
      </thead>
      <tbody>
        ${Array.from({length:maxRows},(_,row)=>`
        <tr>
          ${dayData.map(d=>`<td class="${d.day===today?"today-col":""}">${renderWTOrder(d.orders[row])}</td>`).join("")}
          <td class="notes-col">${withNotes[row]?`
            <div class="wt-note-item">
              <div class="wt-chain">${withNotes[row].chain} · ${withNotes[row].city}</div>
              ${withNotes[row].notes?`<div style="color:var(--text2);margin-top:2px">💬 ${withNotes[row].notes}</div>`:""}
              ${withNotes[row].pickerNote?`<div style="color:var(--blue);margin-top:2px">📋 ${withNotes[row].pickerNote}</div>`:""}
              ${withNotes[row].arrangerNote?`<div style="color:var(--purple);margin-top:2px">👤 ${withNotes[row].arrangerNote}</div>`:""}
            </div>`:""}
          </td>
          <td class="urgent-col">${urgent[row]?`
            <div class="wt-urgent-item">
              <div class="wt-chain" style="color:var(--red)">${urgent[row].chain}</div>
              <div class="wt-city">📍 ${urgent[row].city}</div>
              <div class="wt-pal">סוכן: ${urgent[row].agentName}</div>
              <span class="wt-status wts-new">דחוף!</span>
            </div>`:""}
          </td>
        </tr>`).join("")}
        <tr>
          ${dayData.map(d=>`<td class="wt-col-total ${d.day===today?"today-col":""}">${colTotal(d.orders)}</td>`).join("")}
          <td class="wt-col-total notes-col">${withNotes.length} עם הערות</td>
          <td class="wt-col-total urgent-col">${urgent.length} דחופות</td>
        </tr>
      </tbody>
    </table>
  </div>`;
}

function startPickW(id, e){
  if(e) e.stopPropagation();
  startPick(id);
}

function modal(title,body,actions){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modalActs").innerHTML=actions.map(a=>`<button class="btn ${a.c}" onclick="${a.a}">${a.l}</button>`).join("");
  document.getElementById("modalOv").classList.add("open");
}
function closeModal(){ document.getElementById("modalOv").classList.remove("open"); }
document.getElementById("modalOv").onclick=e=>{if(e.target===document.getElementById("modalOv"))closeModal();};

let tTmr=null;
function toast(msg,type=""){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast"+(type==="err"?" err":type==="warn"?" warn":"");
  t.classList.add("show");
  if(tTmr) clearTimeout(tTmr);
  tTmr=setTimeout(()=>t.classList.remove("show"),2800);
}

// ════════ PWA INSTALL ════════
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault(); deferredPrompt=e;
  const btn=document.getElementById("pwaBtn");
  if(btn) btn.style.display="flex";
});
window.addEventListener("appinstalled",()=>{
  const btn=document.getElementById("pwaBtn"); if(btn) btn.style.display="none";
  deferredPrompt=null;
});
function installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{deferredPrompt=null;});
  } else {
    modal("📲 הוסף למסך הבית",
      `<div style="font-size:14px;color:var(--text2);line-height:2">
        <strong style="color:var(--gold)">iPhone/iPad (Safari):</strong><br/>
        לחץ 📤 → <strong>הוסף למסך הבית</strong> → <strong>הוסף</strong><br/><br/>
        <strong style="color:var(--gold)">Android (Chrome):</strong><br/>
        לחץ ⋮ → <strong>הוסף למסך הבית</strong>
      </div>`,
      [{l:"סגור",c:"btn-ghost",a:"closeModal()"}]
    );
  }
}

// ════════ גיבוי יומי ════════
const BACKUP_KEY="gada_backup_date";
function doBackup(){
  const orders=load(); if(!orders.length) return;
  const today=new Date().toLocaleDateString("he-IL");
  if(localStorage.getItem(BACKUP_KEY)===today) return;
  const key="gada_backup_"+new Date().toISOString().split("T")[0];
  try{
    localStorage.setItem(key,JSON.stringify(orders));
    localStorage.setItem(BACKUP_KEY,today);
    const keys=Object.keys(localStorage).filter(k=>k.startsWith("gada_backup_2")).sort();
    if(keys.length>30) keys.slice(0,keys.length-30).forEach(k=>localStorage.removeItem(k));
    console.log("✅ גיבוי יומי:",key,"–",orders.length,"הזמנות");
  }catch(e){}
}
function getBackups(){
  return Object.keys(localStorage).filter(k=>k.startsWith("gada_backup_2")).sort().reverse()
    .map(k=>({date:k.replace("gada_backup_",""),key:k,count:JSON.parse(localStorage.getItem(k)||"[]").length}));
}
function restoreBackup(key){
  const data=localStorage.getItem(key); if(!data){toast("לא נמצא","err");return;}
  const orders=JSON.parse(data);
  modal("שחזור גיבוי",
    `<div style="font-size:14px;color:var(--text2)">שחזור <strong style="color:var(--gold)">${orders.length}</strong> הזמנות מ-<strong>${key.replace("gada_backup_","")}</strong>?</div>`,
    [{l:"ביטול",c:"btn-ghost",a:"closeModal()"},{l:"🔄 שחזר",c:"btn-gold",a:`doRestore('${key}')`}]
  );
}
function doRestore(key){
  const data=localStorage.getItem(key); if(!data) return;
  const orders=JSON.parse(data);
  save(orders); fbSave(orders);
  closeModal(); toast("✅ שוחזר!"); renderRole(role);
}
setTimeout(doBackup,5000);

// ════════ SESSION TIMEOUT ════════
const SESSION_TIMEOUT = 8 * 60 * 60 * 1000; // 8 שעות
let lastActivity = Date.now();

function resetActivity(){
  lastActivity = Date.now();
  localStorage.setItem("gada_last_activity", lastActivity);
}

function checkSession(){
  if(!role) return;
  const stored = parseInt(localStorage.getItem("gada_last_activity")||"0");
  const last = Math.max(lastActivity, stored);
  if(Date.now() - last > SESSION_TIMEOUT){
    toast("פג תוקף החיבור — נא להתחבר מחדש", "warn");
    setTimeout(goLogin, 1500);
  }
}

// Reset activity on any touch/click
document.addEventListener("click", resetActivity);
document.addEventListener("touchstart", resetActivity);

// Check session every 5 minutes
setInterval(checkSession, 5 * 60 * 1000);

// ════════ RATE LIMITING ════════
let loginAttempts = 0;
let lockUntil = 0;

function checkRateLimit(){
  if(Date.now() < lockUntil){
    const secs = Math.ceil((lockUntil - Date.now())/1000);
    const errEl=document.getElementById("loginErr");
    if(errEl) errEl.textContent=`נסיונות רבים מדי. נסה שוב בעוד ${secs} שניות`;
    return false;
  }
  return true;
}

function recordLoginAttempt(success){
  if(success){ loginAttempts=0; lockUntil=0; return; }
  loginAttempts++;
  if(loginAttempts>=5){
    lockUntil = Date.now() + 60000; // 1 minute lockout
    loginAttempts=0;
  }
}

showScreen("loginScreen");
